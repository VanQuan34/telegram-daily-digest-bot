name: 🌅 Bản Tin Telegram (Sáng 7h & Tối 21h) + GitHub Pages Dashboard

on:
  schedule:
    # 07:00 sáng giờ Việt Nam (00:00 UTC)
    - cron: '0 0 * * *'
    # 21:00 tối giờ Việt Nam (14:00 UTC)
    - cron: '0 14 * * *'

  push:
    branches:
      - master
      - main

  workflow_dispatch:
    inputs:
      edition:
        description: 'Chọn phiên bản gửi (morning / evening)'
        required: false
        default: 'morning'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-digest'
  cancel-in-progress: false

jobs:
  digest-and-deploy:
    name: Tổng hợp dữ liệu, Gửi Telegram & Cập nhật Web Dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      TZ: Asia/Ho_Chi_Minh

    steps:
      - name: 📥 Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 🟢 Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Cài đặt thư viện (npm ci)
        run: npm ci

      - name: 🚀 Tổng hợp dữ liệu (Thời tiết, AQI, Lịch Âm, Giá Vàng, XSMB, Bitcoin, Tin tức) & Đẩy Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_EDITION: ${{ github.event.inputs.edition }}
          # Nếu chỉ push code thông thường thì tạo dữ liệu cho Web Dashboard, còn chạy theo lịch hẹn hoặc bấm Run workflow thì bắn tin Telegram luôn:
          BUILD_STATIC_ONLY: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: npm run send-once

      - name: 🌐 Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Đóng gói giao diện Web Dashboard (thư mục public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: 🚀 Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
